name: release

# Tests, builds, and the GitHub Release run only for a pushed v* tag.
# The tag must equal v<Cargo.toml version>. CI never creates or moves tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag matches Cargo.toml version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "pushed tag $GITHUB_REF_NAME != Cargo.toml v$VERSION"; exit 1;
          }
      - run: cargo test --locked

  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.0
      - run: ./dist.sh
      - run: |
          mkdir -p /tmp/hdxml-check
          tar -xJf hdxml-linux-x64.tar.xz -C /tmp/hdxml-check
          /tmp/hdxml-check/hdxml --version
      - uses: actions/upload-artifact@v4
        with:
          name: hdxml-linux
          path: hdxml-linux-x64.tar.xz
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            suffix: macos-arm64
          - target: x86_64-apple-darwin
            suffix: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target "${{ matrix.target }}" --target-dir target/dist
          tar -cJvf "hdxml-${{ matrix.suffix }}.tar.xz" -C "target/dist/${{ matrix.target }}/release" hdxml
      - uses: actions/upload-artifact@v4
        with:
          name: hdxml-${{ matrix.suffix }}
          path: hdxml-${{ matrix.suffix }}.tar.xz
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc --target-dir target/dist
          .\target\dist\x86_64-pc-windows-msvc\release\hdxml.exe --version
          Compress-Archive -Path .\target\dist\x86_64-pc-windows-msvc\release\hdxml.exe -DestinationPath .\hdxml-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hdxml-windows
          path: hdxml-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "release $TAG already exists; refusing to republish"; exit 1;
          }
          gh release create "$TAG" --title "hdxml $TAG" \
            --notes "hdxml $TAG. Consumed by autowire via its pinned hdxml version." \
            artifacts/hdxml-linux/hdxml-linux-x64.tar.xz \
            artifacts/hdxml-macos-arm64/hdxml-macos-arm64.tar.xz \
            artifacts/hdxml-macos-x64/hdxml-macos-x64.tar.xz \
            artifacts/hdxml-windows/hdxml-windows-x64.zip
